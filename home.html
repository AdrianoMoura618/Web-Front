<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portifólio - API Pokemon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <header class="bg-danger text-white py-5 text-center">
        <div class="container">
            <h1 class="display-4 fw-bold mb-2">Poké Universe</h1>
            <div class="row justify-content-center mb-3">
                <div class="input-group">
                    <input type="text" id="search-input" class="form-control" placeholder="Buscar Pokémon por nome...">
                </div>
            </div>
        </div>
    </header>

    <main class="py-5">
        <div class="container">
            <div class="row g-3 mb-4 align-items-end">
                <div class="col-md-3">
                    <label for="type-filter" class="form-label fw-medium text-secondary">Filtrar por Tipo</label>
                    <select id="type-filter" class="form-select">
                        <option value="">Todos os tipos</option>
                        <option value="grass">Grama</option>
                        <option value="fire">Fogo</option>
                        <option value="water">Água</option>
                        <option value="electric">Elétrico</option>
                        <option value="psychic">Psíquico</option>
                        <option value="ice">Gelo</option>
                        <option value="dragon">Dragão</option>
                        <option value="dark">Sombrio</option>
                        <option value="fairy">Fada</option>
                        <option value="normal">Normal</option>
                        <option value="fighting">Lutador</option>
                        <option value="flying">Voador</option>
                        <option value="poison">Venenoso</option>
                        <option value="ground">Terra</option>
                        <option value="rock">Pedra</option>
                        <option value="bug">Inseto</option>
                        <option value="ghost">Fantasma</option>
                        <option value="steel">Metálico</option>
                    </select>
                </div>
                
                <div class="col-md-3">
                    <label for="items-per-page" class="form-label fw-medium text-secondary">Pokémon por página</label>
                    <select id="items-per-page" class="form-select">
                        <option value="20">20 itens</option>
                        <option value="50" selected>50 itens</option>
                        <option value="100">100 itens</option>
                        <option value="all">Ver Todos</option>
                    </select>
                </div>
            </div>

            <div id="pokemon-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
                <div class="col-12 text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                    <p class="mt-2">Carregando Pokémon...</p>
                </div>
            </div>

            <nav aria-label="Navegação de páginas" class="mt-5">
                <ul id="pagination-container" class="pagination justify-content-center">
                    </ul>
            </nav>
        </div>
    </main>

    <div class="modal fade" id="pokemonModal" tabindex="-1" aria-labelledby="pokemonModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header pokemon-modal-header">
                    <div>
                        <span class="modal-pokemon-id"></span>
                        <h2 class="modal-title fs-4" id="pokemonModalLabel"></h2>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="pokemon-details">
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Carregando...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-4 text-center">
        <div class="container">
            <p class="mb-1">Poké Universe - Adriano Moura &copy; 2025 - Projeto desenvolvido para a disciplina de Web Programming Front End</p>
            <p class="mb-0">Utilizando <a href="https://pokeapi.co/" class="text-info" target="_blank">PokéAPI</a></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
